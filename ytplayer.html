<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Loader</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      padding: 30px;
    }

    input {
      width: 300px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #ff0000;
      color: white;
    }

    button:hover {
      background-color: #cc0000;
    }

    iframe {
      margin-top: 25px;
      max-width: 100%;
    }
  </style>
</head>

<body>
  <h1>YouTube Video Loader</h1>

  <p>Enter a YouTube video ID:</p>
  
  <p>Kinda buggy</p>

  <input
    type="text"
    id="videoIdInput"
    placeholder="Example: dQw4w9WgXcQ"
  >

  <p>Hint, the id is the part like this https://www.youtube.com/watch?v=RGoQCy2BlMw <- the one with numbers at the end</p>

  <button onclick="loadVideo()">Load Video</button>

  <br>

  <iframe id="youtubePlayer" width="560" height="315" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <script>
    function loadVideo() {
      const videoId = document.getElementById("videoIdInput").value.trim();
      const player = document.getElementById("youtubePlayer");

      if (videoId === "") {
        alert("Please enter a YouTube video ID.");
        return;
      }

      player.src = "https://www.youtube.com/embed/" + videoId;
    }
  </script>
</body>
</html>
